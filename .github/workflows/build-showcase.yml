name: Build showcase
on:
  push:
    branches: [main]
    paths: ['showcase/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-showcase
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - run: python scripts/build_showcase.py
      - name: Commit only regenerated tables
        run: |
          git add README.md showcase/README.md 'showcase/*/README.md'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: update showcase'
            git push origin HEAD:main
          fi
