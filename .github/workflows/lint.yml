name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check scripts tests paths/nvidia-gpu
      - run: python -m pytest
      - run: python scripts/check_repo.py
      - run: nbstripout --verify paths/colab/finetune_unsloth_colab.ipynb paths/kaggle/finetune_unsloth_kaggle.ipynb tools/trl-peft/finetune_trl_peft.ipynb
      - name: Check public Markdown links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --timeout 20 --exclude 'github.com/junaiddshaukat/finetune-anywhere/(discussions|graphs|stargazers)' --exclude 'chat.whatsapp.com' --exclude 'colab.research.google.com' --exclude 'kaggle.com' '**/*.md'
          fail: true
