# Resolve the model and data with scripts/prepare_tool.py before running.
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all
dataset: train
eval_dataset: valid
template: qwen3
enable_thinking: false
cutoff_len: 1024
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 0.0002
num_train_epochs: 3.0
fp16: true
logging_steps: 1
save_strategy: epoch
eval_strategy: epoch
report_to: none
seed: 42
