# Resolve the model and data with scripts/prepare_tool.py before running.
load_in_4bit: true
adapter: qlora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_linear: true
chat_template: tokenizer_default
sequence_len: 1024
sample_packing: false
micro_batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 3
learning_rate: 0.0002
optimizer: adamw_torch
lr_scheduler: cosine
fp16: true
bf16: false
activation_checkpointing:
  enabled: true
flash_attention: false
val_set_size: 0
seed: 42
